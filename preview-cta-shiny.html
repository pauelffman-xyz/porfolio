<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview · CTA Shiny</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#24242C;font-family:sans-serif;color:#F4F4F6;padding:48px 24px;min-height:100vh}
  .hint{font-size:13px;color:rgba(244,244,246,.5);text-align:center;margin-bottom:32px}
  .hint b{color:#22F0A4;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:840px;margin:0 auto}

  /* réplica del tile real */
  .tile{
    border-radius:18px;height:260px;overflow:hidden;position:relative;cursor:pointer;
    display:flex;align-items:flex-end;padding:20px;
    transition:transform .3s;
  }
  .tile:hover{transform:translateY(-3px)}
  .tile.sp{background:linear-gradient(160deg,#0f2a1c,#080b09)}
  .tile.ho{background:linear-gradient(160deg,#16235a,#080a12)}
  .tile.mv{background:linear-gradient(160deg,#1a1a1a,#0b0b0b)}
  .tile-name{position:absolute;top:20px;left:20px;font-size:20px;font-weight:700;color:rgba(244,244,246,.9)}

  /* === CSS REAL SHIPPEADO === */
  .tile-arrow{
    align-self:flex-start;background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:.5rem .875rem;border-radius:999px;
    display:inline-flex;align-items:center;gap:.5rem;
    font-family:'JetBrains Mono',monospace;font-size:.5625rem;
    letter-spacing:.1em;text-transform:uppercase;
    transition:background .3s, gap .3s;
  }
  .tile:hover .tile-arrow{background:rgba(0,0,0,.75);gap:.75rem}
  .tile-arrow-label{ color:#22F0A4; display:inline-block; }
  .tile:hover .tile-arrow-label,
  .tile.tile-tapped .tile-arrow-label{
    background:linear-gradient(110deg,#22F0A4 0%,#22F0A4 45%,#CFFBEA 50%,#22F0A4 55%,#22F0A4 100%);
    background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:tileShine 2.4s linear infinite;
  }
  @keyframes tileShine{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @media (prefers-reduced-motion:reduce){
    .tile:hover .tile-arrow-label,.tile.tile-tapped .tile-arrow-label{
      animation:none;background:none;-webkit-text-fill-color:#22F0A4;color:#22F0A4;
    }
  }
</style>
</head>
<body>
  <p class="hint">Pasá el mouse por cada tile (o tocá en mobile) — el <b>brillo barre</b> solo ahí. En reposo queda sólido y legible.</p>
  <div class="grid">
    <div class="tile sp"><span class="tile-name">sukupay ds</span><div class="tile-arrow"><span class="tile-arrow-label">View case study ↗</span></div></div>
    <div class="tile ho"><span class="tile-name">hotaru</span><div class="tile-arrow"><span class="tile-arrow-label">View case study ↗</span></div></div>
    <div class="tile mv"><span class="tile-name">muv</span><div class="tile-arrow"><span class="tile-arrow-label">View case study ↗</span></div></div>
  </div>
  <script>
    // simular tap-to-reveal en touch
    document.querySelectorAll('.tile').forEach(t=>{
      t.addEventListener('click',()=>t.classList.toggle('tile-tapped'));
    });
  </script>
</body>
</html>
